version: 2

project_name: anonbird-ui
builds:
  - id: anonbird-ui
    dir: client/ui
    binary: anonbird-ui
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: anonbird-ui-windows-amd64
    dir: client/ui
    binary: anonbird-ui
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: anonbird-ui-windows-arm64
    dir: client/ui
    binary: anonbird-ui
    env:
      - CGO_ENABLED=1
      - CC=aarch64-w64-mingw32-clang
      - CXX=aarch64-w64-mingw32-clang++
    goos:
      - windows
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: linux-arch
    name_template: "{{ .ProjectName }}-linux_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - anonbird-ui
  - id: windows-arch
    name_template: "{{ .ProjectName }}-windows_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - anonbird-ui-windows-amd64
      - anonbird-ui-windows-arm64

nfpms:
  - maintainer: AnonBird <dev@anonbird.local>
    description: AnonBird client UI.
    homepage: https://github.com/Cr0me1ve/netbird
    id: anonbird_ui_deb
    package_name: anonbird-ui
    builds:
      - anonbird-ui
    formats:
      - deb
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/anonbird.desktop
        dst: /usr/share/applications/anonbird.desktop
      - src: client/ui/assets/anonbird.png
        dst: /usr/share/pixmaps/anonbird.png
    dependencies:
      - anonbird

  - maintainer: AnonBird <dev@anonbird.local>
    description: AnonBird client UI.
    homepage: https://github.com/Cr0me1ve/netbird
    id: anonbird_ui_rpm
    package_name: anonbird-ui
    builds:
      - anonbird-ui
    formats:
      - rpm
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/anonbird.desktop
        dst: /usr/share/applications/anonbird.desktop
      - src: client/ui/assets/anonbird.png
        dst: /usr/share/pixmaps/anonbird.png
    dependencies:
      - anonbird
    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'
