name: Post release topic on Discourse

on:
  release:
    types: [published]

jobs:
  post:
    runs-on: ubuntu-latest
    if: vars.ANONBIRD_DISCOURSE_BASE_URL != ''
    steps:
      - uses: roots/discourse-topic-github-release-action@557d74ea05b6cc0c47f555c1d5d28a89d904005b # v1.1.0
        with:
          discourse-api-key: ${{ secrets.DISCOURSE_RELEASES_API_KEY }}
          discourse-base-url: ${{ vars.ANONBIRD_DISCOURSE_BASE_URL }}
          discourse-author-username: AnonBird
          discourse-category: ${{ vars.ANONBIRD_DISCOURSE_CATEGORY_ID }}
          discourse-tags: releases
