  - ids:
      - default
    repository:
      owner: Cr0me1ve
      name: homebrew-anonbird
      token: "{{ .Env.ANONBIRD_HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: AnonBird
      email: dev@anonbird.local
    description: AnonBird anonymous mesh client.
    download_strategy: CurlDownloadStrategy
    homepage: https://github.com/Cr0me1ve/anonbird
    license: "BSD3"
    test: |
      system "#{bin}/{{ .ProjectName	}} version"

